<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}靶点立项五问{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <style>
    :root { --ink: #1d3a34; --accent: #2e6b5e; }
    body { background: #f1f4f3; color: var(--ink); }
    .navbar { background: var(--ink); }
    .navbar .navbar-brand, .navbar a.nav-link { color: #fff !important; }
    .card { border: 1px solid #e2e8e6; border-radius: .9rem;
            box-shadow: 0 1px 2px rgba(29,58,52,.05); }
    .q-header { padding-left: .75rem; }
    .badge-status-green   { background: #d1e7dd; color: #0f5132; }
    .badge-status-yellow  { background: #fff3cd; color: #664d03; }
    .badge-status-red     { background: #f8d7da; color: #842029; }
    .badge-status-unknown { background: #e2e3e5; color: #41464b; }
    .detail-block { background: #f2f4f3; border-radius: .5rem; font-size: .82rem;
                    max-height: 300px; overflow: auto; }
    .overview-card { background: linear-gradient(180deg, #ffffff, #f7faf9); }
    .evidence-card { border-radius: .8rem; }
    .question-card { border-top: 4px solid var(--accent); }
    .manual-box { background: #f2f4f3; }
    .q-nav { transition: transform .12s ease, box-shadow .12s ease; }
    .q-nav:hover { transform: translateY(-2px);
                   box-shadow: 0 4px 12px rgba(29,58,52,.12); }
    .border-status-green   { border-top: 4px solid #79c2a4; }
    .border-status-yellow  { border-top: 4px solid #e4c363; }
    .border-status-red     { border-top: 4px solid #e28b95; }
    .border-status-unknown { border-top: 4px solid #b9c0bd; }
    .chart-box { position: relative; }
    footer { font-size: .85rem; color: #6b7c78; }
  </style>
</head>
<body>
<nav class="navbar px-3 py-2 mb-4">
  <a class="navbar-brand fw-bold" href="/">🧬 靶点立项五问</a>
  <div><a class="nav-link d-inline" href="/archive">评估归档</a>
       <a class="nav-link d-inline" href="/about">数据源说明</a></div>
</nav>
<main class="container pb-5">
{% block content %}{% endblock %}
</main>
<footer class="container pb-4">
  评估结果由开源数据库自动生成，仅供研究参考，不构成任何立项或投资建议。
</footer>
</body>
</html>
